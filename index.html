<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sector 72 - WebAR Comic</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Courier New', Courier, monospace;
      }
      .ui-container {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
      }
      button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #ff0055;
        color: #fff;
        border: 2px solid #ffaa00;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0px 0px 15px #ff0055;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.95);
      }
      .instructions {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 2px 2px 4px #000;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="instructions">
      <h2>Apunta tu cámara al marcador "Hiro"</h2>
    </div>

    <div class="ui-container">
      <button id="nextBtn">Siguiente Página (1/10)</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <!-- Precargamos las imágenes de tu cómic -->
      <a-assets>
        <img id="p1" src="pagina1.jpg">
        <img id="p2" src="pagina2.jpg">
        <img id="p3" src="pagina3.jpg">
        <img id="p4" src="pagina4.jpg">
        <img id="p5" src="pagina5.jpg">
        <img id="p6" src="pagina6.jpg">
        <img id="p7" src="pagina7.jpg">
        <img id="p8" src="pagina8.jpg">
        <img id="p9" src="pagina9.jpg">
        <img id="p10" src="pagina10.jpg">
      </a-assets>

      <a-marker preset="hiro">
        
        <!-- Panel principal donde se proyectará la viñeta -->
        <a-entity position="0 0.5 0" rotation="-90 0 0">
          
          <!-- Imagen del cómic (ajustada a formato horizontal) -->
          <a-image id="comic-display" src="#p1" width="3.5" height="2" position="0 0.5 0.1"></a-image>

          <!-- Fondo oscuro para el texto -->
          <a-plane width="3.5" height="0.6" color="#0a0a0a" opacity="0.8" position="0 -0.8 0.1"></a-plane>

          <!-- Texto descriptivo en AR -->
          <a-text id="story-text" 
                  value="[1/10]\nSector 72.\nLa lluvia nunca para de quemar..." 
                  align="center" 
                  color="#00ffcc" 
                  width="3" 
                  position="0 -0.8 0.15">
          </a-text>

        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Textos de las 10 páginas
      const texts = [
        "[1/10]\nSector 72.\nLa lluvia nunca para de quemar...",
        "[2/10]\nLa Torre de la Corporacion...\nimpenetrable.",
        "[3/10]\nPuerto de enlace localizado.\nIniciando hackeo.",
        "[4/10]\nCortafuegos superado.\nEl tiempo corre.",
        "[5/10]\nEl nucleo de datos...\nProcesando al limite.",
        "[6/10]\n¡ALERTA!\nIntrusion detectada.",
        "[7/10]\n¡Sobrecarga de pulso!\nLa ultima carta...",
        "[8/10]\nDesvanecerse en las sombras.\nSolo una sombra mas.",
        "[9/10]\nLa informacion esta a salvo.\nEl trabajo esta hecho.",
        "[10/10]\nPor fin... un respiro.\nMañana sera otro dia."
      ];

      // IDs de las imágenes cargadas en <a-assets>
      const images = ['#p1', '#p2', '#p3', '#p4', '#p5', '#p6', '#p7', '#p8', '#p9', '#p10'];

      let currentIndex = 0;
      const textElement = document.querySelector('#story-text');
      const imageDisplay = document.querySelector('#comic-display');
      const btn = document.querySelector('#nextBtn');

      btn.addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= texts.length) {
          currentIndex = 0;
        }
        
        // Actualiza el texto
        textElement.setAttribute('value', texts[currentIndex]);
        
        // Actualiza la imagen mostrada
        imageDisplay.setAttribute('src', images[currentIndex]);
        
        // Efecto de parpadeo holográfico al cambiar de página
        imageDisplay.setAttribute('opacity', '0.5');
        setTimeout(() => {
          imageDisplay.setAttribute('opacity', '1');
        }, 150);

        btn.innerText = `Siguiente Página (${currentIndex + 1}/10)`;
      });
    </script>
  </body>
</html>
